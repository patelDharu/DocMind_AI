<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocMind Chat Bar with ChatGPT Attachment Menu</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    overflow: hidden;
}
.component-container {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    width: 100%;
    padding: 6px 4px 4px 4px;
}

/* ChatGPT Popup Menu placed in normal layout flow ABOVE the searchbar */
.chatgpt-menu-wrapper {
    display: none;
    margin-bottom: 8px;
    margin-left: 2px;
    animation: menuFade 0.15s ease-out;
}
.chatgpt-menu-wrapper.open {
    display: block;
}
@keyframes menuFade {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.chatgpt-menu {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.12), 0 4px 10px -2px rgba(0, 0, 0, 0.05);
    width: 310px;
    max-width: 95%;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 0.15s ease;
    user-select: none;
}
.menu-item:hover {
    background-color: #f1f5f9;
}
.menu-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    color: #334155;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    flex-shrink: 0;
}
.menu-item:hover .menu-icon {
    background: #e2e8f0;
    color: #0f172a;
}
.menu-text-group {
    display: flex;
    flex-direction: column;
}
.menu-title {
    font-size: 14px;
    font-weight: 600;
    color: #1e293b;
    line-height: 1.25;
}
.menu-desc {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
}

/* Main Search Capsule matching Image 2 */
.searchbar-capsule {
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1.5px solid #d1d5db;
    border-radius: 32px;
    padding: 5px 8px 5px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    width: 100%;
    min-height: 52px;
}
.searchbar-capsule:focus-within {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
}

/* Plus Button (Left) matching Image 2 */
.plus-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid #cbd5e1;
    background: #ffffff;
    cursor: pointer;
    color: #475569;
    transition: all 0.15s ease;
    padding: 0;
    margin-right: 8px;
    flex-shrink: 0;
}
.plus-btn:hover {
    background-color: #f1f5f9;
    border-color: #94a3b8;
    color: #0f172a;
    transform: scale(1.06);
}
.plus-btn.active {
    background-color: #e2e8f0;
    color: #1e293b;
    transform: rotate(45deg);
}

/* Attached File Chip (Shows filename and size when selected) */
.attachment-chip {
    display: none;
    align-items: center;
    gap: 6px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 18px;
    padding: 4px 10px;
    font-size: 13px;
    color: #1e40af;
    max-width: 260px;
    margin-right: 8px;
    flex-shrink: 0;
    animation: popIn 0.15s ease-out;
}
@keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.chip-filename {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 140px;
    font-weight: 600;
}
.chip-filesize {
    font-size: 11px;
    color: #64748b;
}
.chip-remove {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    color: #64748b;
    padding: 0 2px;
    line-height: 1;
    border-radius: 50%;
}
.chip-remove:hover {
    color: #ef4444;
}

/* Text Input */
.chat-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    color: #1e293b;
    background: transparent;
    padding: 8px 4px;
    min-width: 0;
}
.chat-input::placeholder {
    color: #94a3b8;
    font-size: 14.5px;
}

/* Right Side Actions: Side-by-Side Mic & Arrow */
.actions-right {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 6px;
    flex-shrink: 0;
}
.mic-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    color: #1f2937;
    transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
    padding: 0;
}
.mic-btn:hover {
    background-color: #f3f4f6;
    color: #111827;
}
.mic-btn:active {
    transform: scale(0.94);
}
.mic-btn.recording {
    color: #dc2626;
    background-color: #fee2e2;
    animation: pulse-ring 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
@keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); transform: scale(1); }
    50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); transform: scale(1.08); }
    100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); transform: scale(1); }
}

.send-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: #2563eb;
    color: #ffffff;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    padding: 0;
    box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
}
.send-btn:hover:not(:disabled) {
    background: #1d4ed8;
    transform: scale(1.04);
}
.send-btn:active:not(:disabled) {
    transform: scale(0.94);
}
.send-btn:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
    box-shadow: none;
}

/* Responsive Styles for Tablet & Mobile */
@media (max-width: 600px) {
    .component-container {
        padding: 2px 2px 2px 2px;
    }
    .searchbar-capsule {
        padding: 3px 5px 3px 8px;
        min-height: 46px;
        border-radius: 24px;
    }
    .plus-btn {
        width: 30px;
        height: 30px;
        margin-right: 4px;
    }
    .plus-btn svg {
        width: 16px;
        height: 16px;
    }
    .attachment-chip {
        max-width: 120px;
        padding: 2px 6px;
        font-size: 11px;
        margin-right: 4px;
        gap: 4px;
    }
    .chip-filename {
        max-width: 65px;
    }
    .chip-filesize {
        display: none;
    }
    .chat-input {
        font-size: 13.5px;
        padding: 5px 2px;
    }
    .chat-input::placeholder {
        font-size: 12px;
    }
    .actions-right {
        gap: 3px;
        margin-left: 2px;
    }
    .mic-btn {
        width: 32px;
        height: 32px;
    }
    .mic-btn svg {
        width: 17px;
        height: 17px;
    }
    .send-btn {
        width: 32px;
        height: 32px;
    }
    .send-btn svg {
        width: 16px;
        height: 16px;
    }
    .chatgpt-menu {
        width: 270px;
        padding: 4px;
        border-radius: 12px;
    }
    .menu-item {
        padding: 8px 10px;
        gap: 8px;
    }
    .menu-icon {
        width: 30px;
        height: 30px;
    }
    .menu-title {
        font-size: 13px;
    }
    .menu-desc {
        font-size: 11px;
    }
}

@media (min-width: 601px) and (max-width: 1024px) {
    .searchbar-capsule {
        padding: 4px 7px 4px 10px;
        min-height: 48px;
    }
    .chat-input {
        font-size: 14px;
    }
    .chat-input::placeholder {
        font-size: 13px;
    }
    .attachment-chip {
        max-width: 180px;
    }
}
</style>
</head>
<body>

<div class="component-container">
    <!-- ChatGPT Popup Menu directly ABOVE the search bar in normal layout flow -->
    <div class="chatgpt-menu-wrapper" id="menuWrapper">
        <div class="chatgpt-menu">
            <!-- Exact item from Image 2: Add photos & files -->
            <div class="menu-item" id="menuUploadFile">
                <div class="menu-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </div>
                <div class="menu-text-group">
                    <span class="menu-title">Add photos & files</span>
                    <span class="menu-desc">Upload from computer</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden native file input -->
    <input
        type="file"
        id="hiddenFileInput"
        style="display: none;"
        accept=".pdf,.docx,.doc,.txt,.md,.csv,.tsv,.xlsx,.xls,.pptx,.html,.htm,.json,.png,.jpg,.jpeg,.webp"
    />

    <!-- Main Capsule Searchbar -->
    <div class="searchbar-capsule" id="capsule">
        <!-- Plus (+) Button on Left matching Image 2 -->
        <button type="button" id="plusBtn" class="plus-btn" title="Add photos & files">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <!-- Attached File Chip (Shows filename and size when selected) -->
        <div class="attachment-chip" id="attachmentChip">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span class="chip-filename" id="chipFilename">document.pdf</span>
            <span class="chip-filesize" id="chipFilesize">3.1 KB</span>
            <button type="button" class="chip-remove" id="chipRemoveBtn" title="Remove file">&times;</button>
        </div>

        <!-- Text Input -->
        <input
            type="text"
            id="chatInput"
            class="chat-input"
            placeholder="Ask a question in English, हिन्दी, or ગુજરાતી..."
            autocomplete="off"
        />

        <!-- Right Side: Outline Mic & Blue Send Arrow side-by-side -->
        <div class="actions-right">
            <button type="button" id="micBtn" class="mic-btn" title="Voice Input (Click to speak)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                </svg>
            </button>

            <button type="button" id="sendBtn" class="send-btn" title="Send message" disabled>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
// Streamlit bidirectional communication
function sendToStreamlit(val) {
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: val
    }, "*");
}

function setFrameHeight(customHeight) {
    const h = customHeight || (document.body ? Math.max(68, document.body.scrollHeight) : 68);
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: h
    }, "*");
}

window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
}, "*");

setFrameHeight(68);

function updatePlaceholder() {
    if (!attachedFile && chatInput) {
        if (window.innerWidth <= 600) {
            chatInput.placeholder = "Ask in English, हिन्दी, ગુજરાતી...";
        } else {
            chatInput.placeholder = "Ask a question in English, हिन्दी, or ગુજરાતી...";
        }
    }
}
window.addEventListener("resize", () => {
    setFrameHeight();
    updatePlaceholder();
});

const plusBtn = document.getElementById("plusBtn");
const menuWrapper = document.getElementById("menuWrapper");
const menuUploadFile = document.getElementById("menuUploadFile");
const hiddenFileInput = document.getElementById("hiddenFileInput");
const attachmentChip = document.getElementById("attachmentChip");
const chipFilename = document.getElementById("chipFilename");
const chipFilesize = document.getElementById("chipFilesize");
const chipRemoveBtn = document.getElementById("chipRemoveBtn");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

let attachedFile = null;

function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

// Plus Button Toggle
plusBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = menuWrapper.classList.toggle("open");
    plusBtn.classList.toggle("active", isOpen);
    if (isOpen) {
        setFrameHeight(145); // Expand frame to show popup menu cleanly
    } else {
        setFrameHeight(68);
    }
});

// Close menu when clicking outside
document.addEventListener("click", (e) => {
    if (!menuWrapper.contains(e.target) && e.target !== plusBtn) {
        if (menuWrapper.classList.contains("open")) {
            menuWrapper.classList.remove("open");
            plusBtn.classList.remove("active");
            setFrameHeight(68);
        }
    }
});

// Menu item: Add photos & files (Upload from computer)
menuUploadFile.addEventListener("click", () => {
    menuWrapper.classList.remove("open");
    plusBtn.classList.remove("active");
    setFrameHeight(68);
    hiddenFileInput.click();
});

// Handle File Selection
hiddenFileInput.addEventListener("change", () => {
    if (hiddenFileInput.files && hiddenFileInput.files.length > 0) {
        const file = hiddenFileInput.files[0];
        const maxBytes = 25 * 1024 * 1024; // 25 MB limit
        if (file.size > maxBytes) {
            alert("⚠️ File \"" + file.name + "\" is " + formatBytes(file.size) + ". The maximum allowed file size is 25 MB. Please select a file up to 25 MB.");
            clearAttachment();
            return;
        }
        attachedFile = file;
        chipFilename.textContent = attachedFile.name;
        chipFilesize.textContent = formatBytes(attachedFile.size);
        attachmentChip.style.display = "inline-flex";
        chatInput.placeholder = "Ask any question about " + attachedFile.name + " (or press Enter to research)...";
        updateSendState();
        chatInput.focus();
    }
});

// Remove Attached File
chipRemoveBtn.addEventListener("click", () => {
    clearAttachment();
});

function clearAttachment() {
    attachedFile = null;
    hiddenFileInput.value = "";
    attachmentChip.style.display = "none";
    updatePlaceholder();
    updateSendState();
}

function updateSendState() {
    const hasText = chatInput.value.trim().length > 0;
    const hasFile = attachedFile !== null;
    sendBtn.disabled = !(hasText || hasFile);
}

chatInput.addEventListener("input", updateSendState);

function submitAction(overrideText) {
    if (chatInput.disabled) return;
    const textQuery = (overrideText !== undefined ? overrideText : chatInput.value).trim();
    if (!textQuery && !attachedFile) return;

    if (attachedFile) {
        const fileToSend = attachedFile;
        sendBtn.disabled = true;
        chatInput.disabled = true;
        chatInput.value = "";
        attachmentChip.style.display = "none";
        chatInput.placeholder = "⏳ Uploading & researching " + fileToSend.name + "...";

        const reader = new FileReader();
        reader.onload = function(evt) {
            const b64Data = evt.target.result.split(',')[1];
            sendToStreamlit({
                type: "file_and_prompt",
                filename: fileToSend.name,
                file_base64: b64Data,
                content: textQuery,
                msg_id: Date.now() + "_" + Math.random().toString(36).substr(2, 6)
            });
            attachedFile = null;
            hiddenFileInput.value = "";
        };
        reader.onerror = function() {
            sendBtn.disabled = false;
            chatInput.disabled = false;
            attachmentChip.style.display = "inline-flex";
            updatePlaceholder();
            updateSendState();
            alert("Error reading file. Please try again.");
        };
        reader.readAsDataURL(fileToSend);
    } else {
        sendToStreamlit({
            type: "text",
            content: textQuery,
            msg_id: Date.now() + "_" + Math.random().toString(36).substr(2, 6)
        });
        chatInput.value = "";
        updateSendState();
    }
}

sendBtn.addEventListener("click", () => submitAction());
chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        if (chatInput.disabled) return;
        submitAction();
    }
});

// Speech Recognition
let recognition = null;
let isRecording = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.lang = "en-IN";

    let preSpeechText = "";
    recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add("recording");
        chatInput.placeholder = "🎙️ Listening... speak now in English, Hindi, or Gujarati...";
        preSpeechText = chatInput.value.trim();
        sendBtn.disabled = true;
    };

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        const fullText = preSpeechText ? (preSpeechText + " " + transcript) : transcript;
        chatInput.value = fullText;
        updateSendState();
    };

    recognition.onerror = (event) => {
        console.warn("Speech recognition error:", event.error);
        stopSpeech();
        updateSendState();
    };

    recognition.onend = () => {
        stopSpeech();
        updateSendState();
        chatInput.focus();
    };
}

function stopSpeech() {
    isRecording = false;
    micBtn.classList.remove("recording");
    updatePlaceholder();
    if (recognition) {
        try { recognition.stop(); } catch(e) {}
    }
}

micBtn.addEventListener("click", () => {
    if (isRecording) {
        if (recognition) recognition.stop();
    } else {
        if (SpeechRecognition) {
            try {
                recognition.start();
            } catch(e) {
                console.warn("Speech recognition start failed:", e);
            }
        } else {
            alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
        }
    }
});
</script>
</body>
</html>
